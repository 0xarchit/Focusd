name: Test Build

on:
  push:
    branches: ["test"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X 'focusd/system.Version=test-build'" -trimpath -o focusd.exe ./cmd/focusd
          go build -ldflags="-s -w -H=windowsgui -X 'focusd/system.Version=test-build'" -trimpath -o focusd_daemon.exe ./cmd/focusd_daemon

      - name: Build NSIS Installer
        run: |
          makensis /DVERSION=test-build installer.nsi

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: focusd-test-build
          path: |
            focusd.exe
            focusd_daemon.exe
            focusd_setup.exe
          retention-days: 5
