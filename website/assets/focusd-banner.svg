<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Space+Grotesk:wght@700;900&amp;display=swap');
      .bg { fill: #090B10; }
      .border { fill: none; stroke: #00E5FF; stroke-width: 2; }
      .border-dim { fill: none; stroke: #1F2937; stroke-width: 2; }
      .txt-cyan { fill: #00E5FF; font-family: 'Fira Code', monospace; }
      .txt-white { fill: #F3F4F6; font-family: 'Fira Code', monospace; }
      .txt-dim { fill: #6B7280; font-family: 'Fira Code', monospace; }
      .txt-green { fill: #10B981; font-family: 'Fira Code', monospace; }
      .title { font-size: 110px; font-weight: 900; fill: #F3F4F6; font-family: 'Space Grotesk', sans-serif; letter-spacing: -3px; }
      .tagline { font-size: 22px; fill: #00E5FF; font-family: 'Fira Code', monospace; font-weight: 600; letter-spacing: -0.5px; }
      .box-cyan { fill: #00E5FF; }
      .box-dim { fill: #1F2937; }
      .pattern { fill: #4B5563; }
    </style>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" class="pattern"/>
      <rect x="2" y="2" width="2" height="2" class="pattern"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <rect class="bg" width="1280" height="640" />
  <rect class="border" x="20" y="20" width="1240" height="600" rx="8" />
  <line class="border" x1="20" y1="70" x2="1260" y2="70" />
  
  <svg x="40" y="27" width="32" height="32" viewBox="0 0 512 512">
    <rect width="512" height="512" fill="#1F2937" rx="128"/>
    <path d="M 160, 100 H 352 V 160 H 220 V 240 H 320 V 300 H 220 V 412 H 160 Z" fill="#F3F4F6"/>
    <rect x="330" y="240" width="30" height="60" fill="#00E5FF" rx="2"/>
    <rect x="60" y="60" width="60" height="16" fill="#00E5FF"/><rect x="60" y="60" width="16" height="60" fill="#00E5FF"/>
    <rect x="392" y="60" width="60" height="16" fill="#00E5FF"/><rect x="436" y="60" width="16" height="60" fill="#00E5FF"/>
    <rect x="60" y="436" width="60" height="16" fill="#00E5FF"/><rect x="60" y="392" width="16" height="60" fill="#00E5FF"/>
    <rect x="392" y="436" width="60" height="16" fill="#00E5FF"/><rect x="436" y="392" width="16" height="60" fill="#00E5FF"/>
  </svg>
  
  <text x="85" y="51" class="txt-cyan" font-size="22" font-weight="700">FOCUSd</text>
  
  <text x="1010" y="51" class="txt-dim" font-size="18">[daemon: </text>
  <circle cx="1120" cy="45" r="6" fill="#10B981" />
  <text x="1140" y="51" class="txt-green" font-size="18" font-weight="700">RUNNING]</text>
  
  <svg x="576" y="90" width="128" height="128" viewBox="0 0 512 512">
    <rect width="512" height="512" fill="none" stroke="#1F2937" stroke-width="12" rx="128"/>
    <path d="M 160, 100 H 352 V 160 H 220 V 240 H 320 V 300 H 220 V 412 H 160 Z" fill="#F3F4F6"/>
    <rect x="330" y="240" width="30" height="60" fill="#00E5FF" rx="2"/>
    <rect x="60" y="60" width="60" height="16" fill="#00E5FF"/><rect x="60" y="60" width="16" height="60" fill="#00E5FF"/>
    <rect x="392" y="60" width="60" height="16" fill="#00E5FF"/><rect x="436" y="60" width="16" height="60" fill="#00E5FF"/>
    <rect x="60" y="436" width="60" height="16" fill="#00E5FF"/><rect x="60" y="392" width="16" height="60" fill="#00E5FF"/>
    <rect x="392" y="436" width="60" height="16" fill="#00E5FF"/><rect x="436" y="392" width="16" height="60" fill="#00E5FF"/>
  </svg>
  
  <text x="640" y="300" class="title" text-anchor="middle">Focusd</text>
  <text x="640" y="350" class="tagline" text-anchor="middle">TERMINAL-BASED FOCUS &amp; TIME TRACKER</text>
  <text x="640" y="385" class="txt-dim" font-size="18" text-anchor="middle">Code Fast. Stay Locked In.</text>
  
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="280" height="120" class="border-dim" rx="6" />
    <text x="20" y="35" class="txt-dim" font-size="14" font-weight="700">WEEKLY TREND</text>
    <rect x="20" y="55" width="240" height="12" class="box-cyan" rx="2" />
    <rect x="20" y="75" width="160" height="12" class="box-cyan" rx="2" />
    <rect x="185" y="75" width="75" height="12" fill="url(#dither)" rx="2" />
    <rect x="20" y="95" width="200" height="12" class="box-cyan" rx="2" />
  </g>
  
  <g transform="translate(460, 420)">
    <rect x="0" y="0" width="400" height="120" class="bg" rx="6" />
    <rect x="0" y="0" width="400" height="120" fill="url(#glow)" rx="6" />
    <rect x="0" y="0" width="400" height="120" class="border" rx="6" />
    <text x="35" y="55" class="txt-cyan" font-size="28" font-weight="700">&gt;</text>
    <text x="65" y="55" class="txt-white" font-size="26" font-weight="700">focusd start</text>
    <text x="65" y="85" class="txt-cyan" font-size="14">Tracking active...</text>
    <rect x="65" y="100" width="280" height="4" class="box-dim" rx="2" />
    <rect x="65" y="100" width="210" height="4" class="box-cyan" rx="2" />
  </g>
  
  <g transform="translate(900, 420)">
    <rect x="0" y="0" width="240" height="120" class="border-dim" rx="6" />
    <text x="20" y="30" class="txt-dim" font-size="14" font-weight="700">TODAY</text>
    <text x="20" y="60" class="txt-dim" font-size="14">Screen Time</text>
    <text x="220" y="60" class="txt-white" font-size="14" font-weight="700" text-anchor="end">12h 22m</text>
    <text x="20" y="85" class="txt-dim" font-size="14">Active Apps</text>
    <text x="220" y="85" class="txt-white" font-size="14" font-weight="700" text-anchor="end">19</text>
    <text x="20" y="110" class="txt-dim" font-size="14">Limits Hit</text>
    <text x="220" y="110" class="txt-cyan" font-size="14" font-weight="700" text-anchor="end">0</text>
  </g>

  <line class="border" x1="20" y1="570" x2="1260" y2="570" />
  <text x="40" y="602" class="txt-cyan" font-size="15" font-weight="700">[s] <tspan class="txt-dim" font-weight="400">Start Focus</tspan>    [n] <tspan class="txt-dim" font-weight="400">Add App Limit</tspan>    [p] <tspan class="txt-dim" font-weight="400">Pause Tracking</tspan>    [q] <tspan class="txt-dim" font-weight="400">Quit App</tspan></text>
</svg>
